<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  :root{
    --red:#DA291C; --red-dk:#b01d12; --gold:#FFC72C; --gold-dk:#C98A00;
    --cream:#FBF6EC; --paper:#FFFFFF; --ink:#241A15; --ink-2:#6B5A4B;
    --ink-3:#A9988A; --line:#EDE3D4;
    --r:#B9AA97; --sr:#2F6FE4; --ssr:#D99A00;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 520px at 12% -10%, #FFE9C9 0%, rgba(255,233,201,0) 62%),
      radial-gradient(900px 480px at 92% 0%, #FFD9D2 0%, rgba(255,217,210,0) 58%),
      var(--cream);
    min-height:100vh; padding:28px 16px 56px;
  }
  .wrap{max-width:1120px;margin:0 auto}

  /* ---------- 头部 ---------- */
  .hero{
    background:linear-gradient(140deg,#DA291C 0%,#b01d12 58%,#8f150c 100%);
    border-radius:24px;padding:26px 28px 24px;color:#fff;position:relative;overflow:hidden;
    box-shadow:0 18px 48px rgba(176,29,18,.26);
  }
  .hero::after{
    content:"";position:absolute;right:-70px;top:-90px;width:300px;height:300px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,199,44,.55),rgba(255,199,44,0) 68%);
  }
  .brandrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .logo{font-size:22px;font-weight:800;letter-spacing:1.5px}
  .slogan{font-size:12.5px;opacity:.82;margin-left:2px}
  .hero-main{display:flex;align-items:flex-end;justify-content:space-between;
    gap:22px;margin-top:18px;flex-wrap:wrap;position:relative;z-index:1}
  .big{font-size:52px;font-weight:800;line-height:.95;letter-spacing:-1px}
  .big small{font-size:17px;font-weight:600;opacity:.78;letter-spacing:0}
  .big .sub{display:block;font-size:12.5px;font-weight:500;opacity:.8;margin-top:8px;letter-spacing:.5px}
  .lv{display:inline-block;margin-top:12px;background:var(--gold);color:#5c3a00;
    font-weight:800;font-size:13px;padding:5px 14px;border-radius:999px}
  .ring{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--gold) calc(var(--p) * 1%), rgba(255,255,255,.22) 0);
    position:relative;flex:0 0 auto}
  .ring::before{content:"";position:absolute;inset:9px;border-radius:50%;
    background:linear-gradient(150deg,#c02418,#8f150c)}
  .ring b{position:relative;font-size:24px;font-weight:800}
  .ring b i{font-size:11px;font-style:normal;font-weight:600;opacity:.8;display:block;text-align:center}

  .legend{list-style:none;display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;position:relative;z-index:1}
  .legend li{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
    padding:6px 11px;border-radius:999px;backdrop-filter:blur(2px)}
  .legend li i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .legend li em{font-style:normal;font-weight:500;opacity:.75;font-size:11px}
  .legend .r-r i{background:var(--r)}
  .legend .r-sr i{background:var(--sr)}
  .legend .r-ssr i{background:var(--ssr)}
  .legend .r-ur i{background:linear-gradient(135deg,#ff5f6d,#ffc371,#5fc3ff,#c58bff)}

  /* ---------- 册别导航 ---------- */
  .booknav{position:sticky;top:0;z-index:9;display:flex;gap:8px;overflow-x:auto;
    padding:14px 2px 12px;margin-top:6px;background:linear-gradient(var(--cream) 72%,rgba(251,246,236,0));
    scrollbar-width:none}
  .booknav::-webkit-scrollbar{display:none}
  .booknav a{flex:0 0 auto;text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:700;
    background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 13px;
    box-shadow:0 2px 8px rgba(120,90,50,.06);transition:.16s}
  .booknav a:hover{border-color:var(--red);color:var(--red);transform:translateY(-1px)}
  .booknav a em{font-style:normal;color:var(--ink-3);font-weight:600}

  /* ---------- 册 ---------- */
  .book{margin-top:26px}
  .book-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .book-head h2{font-size:17px;font-weight:800;letter-spacing:.4px}
  .book-head h2 .done{font-style:normal;font-size:11px;font-weight:700;color:#1a7f4b;
    background:#e6f7ec;border:1px solid #bfe8cf;border-radius:999px;padding:2px 8px;margin-left:6px}
  .bp{display:flex;align-items:center;gap:9px;flex:1;min-width:180px}
  .bp-bar{flex:1;height:7px;background:#EFE6D7;border-radius:99px;overflow:hidden}
  .bp-bar i{display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--gold),var(--red))}
  .bp span{font-size:11.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:10px}

  /* ---------- 格子 ---------- */
  .cell{background:var(--paper);border:2px solid var(--line);border-radius:15px;
    overflow:hidden;position:relative;transition:transform .16s,box-shadow .16s,border-color .16s;
    display:flex;flex-direction:column}
  .cell .thumb{aspect-ratio:1/1;display:grid;place-items:center;background:
    radial-gradient(circle at 50% 42%,#FFFDF8,#F6EEE1);position:relative;overflow:hidden}
  .cell .thumb img{width:100%;height:100%;object-fit:contain;padding:7px;display:block;
    position:relative;z-index:1}
  .thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;opacity:.22}
  .cell figcaption{display:flex;flex-direction:column;gap:3px;padding:7px 8px 9px}
  .cell figcaption b{font-size:11.5px;font-weight:700;line-height:1.28;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    min-height:2.56em;letter-spacing:.1px}
  .cell .chip{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.4px;
    color:var(--ink-3);text-transform:uppercase}
  .cell .date{font-style:normal;font-size:9.5px;color:#C3B4A4;font-variant-numeric:tabular-nums}
  .cell .cnt{position:absolute;right:6px;top:6px;background:var(--red);color:#fff;
    font-size:10px;font-weight:800;font-style:normal;padding:2px 7px;border-radius:999px;
    box-shadow:0 2px 6px rgba(176,29,18,.3)}

  .cell.lit{cursor:default}
  .cell.lit:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(150,100,50,.14)}
  .cell.lit.r-r{border-color:#E7DCCB}
  .cell.lit.r-sr{border-color:#BFD6FF;box-shadow:0 0 0 3px rgba(47,111,228,.07)}
  .cell.lit.r-sr .chip{color:var(--sr)}
  .cell.lit.r-ssr{border-color:#F3CE6B;box-shadow:0 0 0 3px rgba(217,154,0,.09)}
  .cell.lit.r-ssr .chip{color:var(--gold-dk)}
  .cell.lit.r-ssr .thumb{background:radial-gradient(circle at 50% 40%,#FFFBEC,#FDF0CE)}
  .cell.lit.r-ur{
    border:2px solid transparent;border-radius:15px;
    background-image:linear-gradient(var(--paper),var(--paper)),
      conic-gradient(from 0deg,#ff5f6d,#ffc371,#8ef6b8,#5fc3ff,#c58bff,#ff5f6d);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 6px 20px rgba(180,90,220,.16)}
  .cell.lit.r-ur .chip{color:#8b3fd0}

  .cell.locked{background:#F8F4EC;border-style:dashed;border-color:#E4D9C8}
  .cell.locked .thumb{background:radial-gradient(circle at 50% 42%,#FBF6EC,#F1E9DA)}
  /* 官方产品图是白底 PNG: 直接压黑会得到一整块黑砖。
     用 multiply 混合 + 降透明度, 白底自动融进纸色, 只剩产品轮廓 —— 真正的「剪影」。
     blur 是必需的: 官方图右上角自带「100% 纯牛肉」「限时特惠」等角标,
     不糊掉就等于把答案写在剪影上。伪元素再压一层纸色, 双保险。*/
  .cell.locked .thumb img.sil{mix-blend-mode:multiply;
    filter:grayscale(1) contrast(1.02) blur(.9px);opacity:.42}
  .cell.locked .thumb::after{content:"";position:absolute;top:2px;right:2px;z-index:2;
    width:54%;height:44%;pointer-events:none;
    background:radial-gradient(125% 125% at 100% 0,rgba(245,239,230,.995) 50%,rgba(245,239,230,0) 84%)}
  .cell.locked figcaption b{color:#B6A695;letter-spacing:2px}
  .cell.locked:hover{border-color:#D6C7AF}
  .cell.locked:hover .thumb img.sil{opacity:.58}

  .sil-none{font-size:26px;opacity:.35}

  /* ---------- 绝版殿堂 ---------- */
  .hall{margin-top:34px;background:linear-gradient(150deg,#231A2E,#151019 62%);border-radius:22px;
    padding:22px 22px 24px;color:#F4EDE3;box-shadow:0 18px 44px rgba(30,18,40,.28)}
  .hall h2{font-size:17px;font-weight:800;display:flex;align-items:baseline;gap:10px}
  .hall h2 small{font-size:11.5px;font-weight:500;opacity:.6;letter-spacing:.4px}
  .hall-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
  .ur-card{background:rgba(255,255,255,.055);border-radius:16px;padding:10px;
    border:1px solid transparent;position:relative;overflow:hidden;
    /* 全息描边: 底图压深 + 锥形彩虹做 border-box 渐变 */
    background-image:linear-gradient(rgba(26,18,34,.94),rgba(26,18,34,.94)),
      conic-gradient(from 200deg,#ff5f6d,#ffc371,#8ef6b8,#5fc3ff,#c58bff,#ff5f6d);
    background-origin:border-box;background-clip:padding-box,border-box}
  .ur-card .thumb{aspect-ratio:1/1;display:grid;place-items:center;border-radius:11px;
    background:radial-gradient(circle at 50% 40%,#FFFCF4,#EFE4D1);position:relative;overflow:hidden}
  .ur-card .thumb img{width:100%;height:100%;object-fit:contain;padding:8px;position:relative;z-index:1}
  .ur-card .thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;opacity:.3}
  .ur-card .holo{position:absolute;inset:0;
    background:conic-gradient(from 0deg,rgba(255,95,109,.20),rgba(255,195,113,.16),
      rgba(142,246,184,.16),rgba(95,195,255,.20),rgba(197,139,255,.20),rgba(255,95,109,.20));
    mix-blend-mode:screen;animation:spin 9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ur-card figcaption{display:flex;flex-direction:column;gap:4px;padding:9px 3px 2px}
  .ur-card figcaption b{font-size:12.5px;font-weight:800;line-height:1.3}
  .ur-card figcaption .chip{font-style:normal;font-size:9.5px;font-weight:800;color:#F7C6FF;letter-spacing:.6px}
  .ur-card figcaption em{font-style:normal;font-size:9.5px;color:rgba(244,237,227,.5)}
  .hall .hint{font-size:12px;opacity:.55;margin-top:12px;line-height:1.7}

  /* ---------- 页脚 ---------- */
  .foot{margin-top:30px;display:flex;justify-content:space-between;align-items:center;
    gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3)}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .badge{background:#FFF6DC;border:1px solid #F0DA9B;color:#8A5A00;border-radius:999px;
    padding:4px 10px;font-size:11px;font-weight:600}
  .badge.muted{background:#F3F0EA;border-color:#E3DED4;color:#A79C8E}
  .hint{font-size:12.5px;color:var(--ink-2);line-height:1.8}

  @media (max-width:640px){
    body{padding:16px 12px 40px}
    .hero{padding:20px;border-radius:20px}
    .big{font-size:40px}
    .ring{width:92px;height:92px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
    .cell figcaption b{font-size:10.5px}
  }
  @media print{
    body{background:#fff;padding:0}
    .booknav{display:none}
    .cell.lit:hover{transform:none;box-shadow:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="brandrow">
      <span class="logo">🍟 麦麦图鉴</span>
      <span class="slogan">每一次点单，点亮图鉴里的一页</span>
    </div>
    <div class="hero-main">
      <div>
        <div class="big">{{UNLOCKED}}<small> / {{POOL_TOTAL}} 款</small>
          <span class="sub">已集齐 {{COMPLETION}}% · 绝版 {{UR_COUNT}} 张</span>
        </div>
        <div class="lv">{{LEVEL}}</div>
      </div>
      <div class="ring" style="--p:{{COMPLETION}}"><b>{{COMPLETION}}%<i>完成度</i></b></div>
    </div>
    {{LEGEND}}
  </header>

  {{BOOK_NAV}}
  {{BOOK_SECTIONS}}
  {{HALL_OF_FAME}}

  <footer class="foot">
    <div class="badges">{{BADGES}}</div>
    <div>McD Codex · 麦麦图鉴 · 非麦当劳官方产品 · 生成于 {{GENERATED_AT}}</div>
  </footer>
</div>
</body>
</html>
